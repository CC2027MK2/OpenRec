name: Build Windows Installer

# 推 main 出构建产物（Actions artifact）；推 v* tag 额外把安装包挂到该 tag 的 Release。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PYINSTALLER_VERSION: '6.22.3'

jobs:
  build:
    name: Windows x64 构建（PyInstaller + Inno Setup）
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      # 先做版本校验：失败要快，别浪费十几分钟构建。
      - name: 校验 tag 与源码版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          $src = Get-Content -Path 'openrec/config.py' -Raw -Encoding utf8
          $m = [regex]::Match($src, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $m.Success) {
            Write-Host "::error::无法从 openrec/config.py 解析出 APP_VERSION，无法校验版本"
            exit 1
          }
          $appVer = $m.Groups[1].Value
          # 允许 v1.6.8 以及 v1.6.8-<预发布后缀>；v1.6.9 这类真实版本不一致仍然失败。
          $pattern = '^' + [regex]::Escape($appVer) + '(-[0-9A-Za-z.]+)?$'
          if ($ver -notmatch $pattern) {
            Write-Host "::error::版本不一致：tag 为 $tag（去掉前缀 v 后是 $ver），但 openrec/config.py 里 APP_VERSION = '$appVer'。请先把源码版本号改成 $ver（改完提交到 main）再重新打 tag。"
            exit 1
          }
          if ($ver -ne $appVer) {
            Write-Host "::warning::tag $tag 带预发布后缀，按源码版本 $appVer 构建安装包（安装包版本号来自 installer/OpenRec.iss）。"
          }
          Write-Host "版本校验通过：tag=$tag，APP_VERSION=$appVer"
          $iss = Get-Content -Path 'installer/OpenRec.iss' -Raw -Encoding utf8
          $im = [regex]::Match($iss, '#define\s+MyAppVersion\s+"([^"]+)"')
          if ($im.Success) {
            Write-Host "installer/OpenRec.iss 里的 MyAppVersion = $($im.Groups[1].Value)"
          }

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==$env:PYINSTALLER_VERSION"
          python -c "import PySide6, numpy, cv2, mss, soundcard, dxcam, qrcode; print('deps ok, PySide6', PySide6.__version__, 'numpy', numpy.__version__)"

      - name: 下载 FFmpeg 并放入 bin/
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path 'bin' | Out-Null

          # OpenRec.spec 第 31 行硬依赖 bin/ffmpeg.exe 与 bin/ffprobe.exe；
          # .gitignore 排除了 bin/*，所以只能在 CI 里现下载。
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip'
          )
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $downloaded = $false
          foreach ($url in $sources) {
            if ($downloaded) { break }
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "下载 FFmpeg（第 $attempt/3 次）：$url"
              Remove-Item -Force -ErrorAction SilentlyContinue $zip
              & curl.exe -L --fail --silent --show-error --connect-timeout 30 --max-time 900 --retry 2 --retry-delay 5 -o $zip $url
              $code = $LASTEXITCODE
              if ($code -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 10MB) {
                Write-Host ("下载完成：{0:N1} MB" -f ((Get-Item $zip).Length / 1MB))
                $downloaded = $true
                break
              }
              Write-Host "下载失败（curl 退出码 $code），$([int](5 * $attempt)) 秒后重试"
              Start-Sleep -Seconds ([int](5 * $attempt))
            }
          }
          if (-not $downloaded) {
            Write-Host '::error::FFmpeg 下载失败：gyan.dev 与 BtbN 两个源各重试 3 次都不行，请检查网络或换镜像源。'
            exit 1
          }

          $ffDir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Force -Path $ffDir | Out-Null
          & tar.exe -xf $zip -C $ffDir
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'tar 解压失败，改用 Expand-Archive'
            Expand-Archive -Path $zip -DestinationPath $ffDir -Force
          }

          $ff = Get-ChildItem -Path $ffDir -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $fp = Get-ChildItem -Path $ffDir -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ff -or -not $fp) {
            Write-Host "::error::FFmpeg 压缩包里找不到 ffmpeg.exe / ffprobe.exe"
            Get-ChildItem -Path $ffDir -Recurse | Select-Object -First 30 FullName
            exit 1
          }
          Copy-Item -Force $ff.FullName (Join-Path $PWD 'bin\ffmpeg.exe')
          Copy-Item -Force $fp.FullName (Join-Path $PWD 'bin\ffprobe.exe')
          Get-ChildItem 'bin' | Select-Object Name, Length | Format-Table -AutoSize
          & (Join-Path $PWD 'bin\ffmpeg.exe') -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::下载到的 ffmpeg.exe 无法运行'
            exit 1
          }

      - name: PyInstaller 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # spec 里 upx=True：runner 上没有 UPX 只会警告并跳过压缩，不影响产物。
          python -m PyInstaller --noconfirm --clean OpenRec.spec
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PyInstaller 构建失败（退出码 $LASTEXITCODE）"
            exit 1
          }
          if (-not (Test-Path 'dist/OpenRec/OpenRec.exe')) {
            Write-Host '::error::PyInstaller 没有产出 dist/OpenRec/OpenRec.exe'
            exit 1
          }
          Get-ChildItem 'dist/OpenRec' | Select-Object Name, Length | Format-Table -AutoSize
          foreach ($p in @('dist/OpenRec/LICENSE', 'dist/OpenRec/LICENSES', 'dist/OpenRec/docs/OpenRec.ico')) {
            if (-not (Test-Path $p)) { Write-Host "::warning::dist 里缺少 $p（.iss 会照常打包其余文件）" }
          }

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'runner 上没有 Inno Setup，用 Chocolatey 安装'
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            Write-Host '::error::安装后仍找不到 ISCC.exe（Inno Setup 6）'
            exit 1
          }
          Write-Host "ISCC = $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 编译安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # .iss 第 11-13 行支持 /DMyOutputDir= 覆盖默认输出目录；第 53 行从 {#BuildRoot}\dist\OpenRec\* 取文件。
          $out = Join-Path $PWD 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:ISCC_PATH 'installer\OpenRec.iss' "/DMyOutputDir=$out"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Inno Setup 编译失败（ISCC 退出码 $LASTEXITCODE）"
            exit 1
          }
          $setup = Get-ChildItem -Path $out -Filter 'OpenRec_Setup_*.exe' | Select-Object -First 1
          if (-not $setup) {
            Write-Host '::error::没有产出 OpenRec_Setup_*.exe'
            Get-ChildItem $out
            exit 1
          }
          Write-Host ("安装包：{0}（{1:N1} MB / {2} 字节）" -f $setup.Name, ($setup.Length / 1MB), $setup.Length)
          if ($setup.Length -lt 5MB) {
            Write-Host '::error::安装包小于 5 MB，明显不正常'
            exit 1
          }
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenRec-Setup-${{ github.ref_name }}
          path: out/OpenRec_Setup_*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 附加安装包到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          Write-Host "目标 Release：$repo $tag"
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，创建它"
            gh release create $tag --repo $repo --verify-tag --generate-notes --title "OpenRec $tag"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::创建 Release $tag 失败（gh 退出码 $LASTEXITCODE）"
              exit 1
            }
          }
          gh release upload $tag $env:SETUP_PATH --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::上传安装包到 Release $tag 失败（gh 退出码 $LASTEXITCODE）"
            exit 1
          }
          gh release view $tag --repo $repo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::回读 Release $tag 失败"
            exit 1
          }
          Write-Host "Release 附件上传完成：$env:SETUP_NAME"
